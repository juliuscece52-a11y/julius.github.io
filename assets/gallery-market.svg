<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A price chart being studied for market practice">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0a1a2c"/>
      <stop offset="0.6" stop-color="#061020"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="mgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2dcab"/>
      <stop offset="1" stop-color="#b98f4d"/>
    </linearGradient>
    <linearGradient id="mfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a25e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c9a25e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a25e" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c9a25e" stop-opacity="0"/>
