<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A tidy, freshly cleaned living room">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e31"/>
      <stop offset="0.6" stop-color="#081525"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <linearGradient id="hlight" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f4dcae" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c9a25e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2133"/>
      <stop offset="1" stop-color="#050b13"/>
    </linearGradient>
    <linearGradient id="hgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2dcab"/>
      <stop offset="1" stop-color="#b98f4d"/>
    </linearGradient>
    <linearGradient id="hwin" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f6e3bb" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#d8b273" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a97f42" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="hplank" width="120" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 25.5h120M0 0h120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <path d="M60 0v26M14 0v26" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#hbg)"/>

  <!-- window with light -->
  <g>
    <rect x="430" y="70" width="300" height="250" rx="6" fill="url(#hwin)"/>
    <rect x="430" y="70" width="300" height="250" rx="6" fill="none" stroke="#c9a25e" stroke-opacity="0.3"/>
    <path d="M580 70v250M430 195h300" stroke="#08131f" stroke-width="5" opacity="0.55"/>
    <path d="M430 70h300v250H430z" fill="url(#hlight)" opacity="0.6"/>
    <!-- curtain -->
    <path d="M404 56h34c14 90 14 190 0 278h-34z" fill="#0b1a2b"/>
    <path d="M722 56h36v278h-36c14-88 14-188 0-278z" fill="#0b1a2b"/>
    <path d="M410 56c10 90 10 190 0 278M734 56c-10 90-10 190 0 278" fill="none" stroke="#e9cf92" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- floor -->
  <rect y="404" width="800" height="196" fill="url(#hfloor)"/>
  <rect y="404" width="800" height="196" fill="url(#hplank)"/>
  <path d="M0 404h800" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- sunlight on floor -->
  <path d="M448 404h268l-86 152H412z" fill="#f4dcae" fill-opacity="0.07"/>

  <!-- sofa -->
  <g>
    <rect x="96" y="286" width="292" height="106" rx="22" fill="#0d2032" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="112" y="242" width="260" height="70" rx="20" fill="#122a3f"/>
    <rect x="82" y="322" width="34" height="78" rx="16" fill="#122a3f"/>
    <rect x="368" y="322" width="34" height="78" rx="16" fill="#122a3f"/>
    <rect x="140" y="264" width="88" height="54" rx="12" fill="#0a1a2b" transform="rotate(-3 184 291)"/>
    <rect x="248" y="264" width="88" height="54" rx="12" fill="#0a1a2b" transform="rotate(3 292 291)"/>
    <g stroke="#e9cf92" stroke-opacity="0.22" stroke-width="1.5">
      <path d="M126 300v76M358 300v76M126 300h232"/>
    </g>
    <rect x="126" y="398" width="14" height="26" rx="4" fill="#08131f"/>
    <rect x="350" y="398" width="14" height="26" rx="4" fill="#08131f"/>
  </g>

  <!-- coffee table with folded towels -->
  <g>
    <rect x="196" y="446" width="212" height="14" rx="7" fill="#0b1a2a" stroke="#ffffff" stroke-opacity="0.09"/>
    <path d="M214 460v42M390 460v42" stroke="#0b1a2a" stroke-width="8" stroke-linecap="round"/>
    <rect x="226" y="416" width="76" height="14" rx="5" fill="#e9cf92" fill-opacity="0.7"/>
    <rect x="232" y="402" width="64" height="14" rx="5" fill="#e9cf92" fill-opacity="0.5"/>
    <rect x="238" y="388" width="52" height="14" rx="5" fill="#e9cf92" fill-opacity="0.32"/>
    <circle cx="344" cy="428" r="16" fill="#122a3f" stroke="#e9cf92" stroke-opacity="0.3"/>
    <circle cx="344" cy="428" r="7" fill="#e9cf92" fill-opacity="0.35"/>
  </g>

  <!-- plant -->
  <g transform="translate(560 356)">
    <path d="M32 92h56l-10 88H42z" fill="#0c1d2d" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M60 92V26" stroke="#3f6b52" stroke-width="3"/>
    <path d="M60 54C40 46 30 28 32 8c20 2 32 18 36 40z" fill="#16352a"/>
    <path d="M60 60c20-8 30-26 28-46-20 2-32 18-36 40z" fill="#1b4233"/>
    <path d="M60 82C44 78 34 64 34 48c18 2 28 14 32 30z" fill="#143026"/>
    <path d="M32 180h56" stroke="#e9cf92" stroke-opacity="0.16" stroke-width="2"/>
  </g>

  <!-- wall art / mirror -->
  <g>
    <rect x="96" y="112" width="176" height="112" rx="4" fill="#0a1a2b" stroke="#c9a25e" stroke-opacity="0.32"/>
    <path d="M108 210l44-52 30 32 24-26 42 46z" fill="#e9cf92" fill-opacity="0.14"/>
    <circle cx="150" cy="146" r="12" fill="#e9cf92" fill-opacity="0.3"/>
  </g>

  <!-- skirting + sparkle accents -->
  <path d="M0 566h800" stroke="#ffffff" stroke-opacity="0.05"/>
  <g fill="#f2dcab" fill-opacity="0.5">
    <path d="M322 348l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z"/>
    <path d="M502 372l2.6 6.6 6.6 2.6-6.6 2.6-2.6 6.6-2.6-6.6-6.6-2.6 6.6-2.6z"/>
  </g>

  <rect x="0.5" y="0.5" width="799" height="599" fill="none" stroke="#c9a25e" stroke-opacity="0.12"/>
</svg>
