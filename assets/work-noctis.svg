<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="NOCTIS dashboard interface">
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1222"/>
      <stop offset="1" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="n-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="n-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59e1ff"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <radialGradient id="n-glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="n-blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#n-bg)"/>
  <rect width="800" height="600" fill="url(#n-glow)"/>
  <ellipse cx="700" cy="80" rx="160" ry="90" fill="#6f8cff" opacity="0.18" filter="url(#n-blur)"/>

  <!-- window -->
  <rect x="44" y="46" width="712" height="508" rx="16" fill="#0b0e19" stroke="#ffffff" stroke-opacity="0.12"/>
  <path d="M44 62a16 16 0 0116-16h680a16 16 0 0116 16v24H44z" fill="#121627"/>
  <g fill="#ffffff" fill-opacity="0.28">
    <circle cx="66" cy="66" r="4"/><circle cx="80" cy="66" r="4"/><circle cx="94" cy="66" r="4"/>
  </g>
  <rect x="300" y="58" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <rect x="640" y="58" width="96" height="16" rx="8" fill="#4f7dff" fill-opacity="0.35"/>

  <!-- sidebar -->
  <rect x="44" y="86" width="118" height="468" fill="#080b14"/>
  <g fill="#ffffff" fill-opacity="0.14">
    <rect x="62" y="112" width="60" height="9" rx="4.5"/>
    <rect x="62" y="150" width="82" height="7" rx="3.5"/>
    <rect x="62" y="172" width="72" height="7" rx="3.5"/>
    <rect x="62" y="194" width="80" height="7" rx="3.5"/>
    <rect x="62" y="216" width="56" height="7" rx="3.5"/>
  </g>
  <rect x="54" y="142" width="98" height="24" rx="7" fill="#4f7dff" fill-opacity="0.16"/>
  <rect x="54" y="142" width="2" height="24" rx="1" fill="#4f7dff"/>
  <rect x="62" y="498" width="82" height="36" rx="9" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="76" cy="516" r="8" fill="#8f6bff" fill-opacity="0.5"/>
  <rect x="90" y="512" width="42" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.16"/>

  <!-- header -->
  <text x="186" y="124" font-family="Sora, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e9edff">Treasury overview</text>
  <text x="186" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="10.5" fill="#6f7a99">All accounts · Updated 12s ago</text>
  <rect x="596" y="108" width="98" height="28" rx="8" fill="#4f7dff" fill-opacity="0.9"/>
  <text x="645" y="126" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Approve</text>

  <!-- kpi cards -->
  <g>
    <rect x="186" y="168" width="150" height="78" rx="12" fill="#111527" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="202" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7c88a8" letter-spacing="1">CASH POSITION</text>
    <text x="202" y="216" font-family="Sora, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#f2f5ff">€4.82M</text>
    <rect x="202" y="226" width="46" height="10" rx="5" fill="#58e6a8" fill-opacity="0.16"/>
    <text x="208" y="234" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#6ee7b7">+12.4%</text>

    <rect x="350" y="168" width="150" height="78" rx="12" fill="#111527" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="366" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7c88a8" letter-spacing="1">RUNWAY</text>
    <text x="366" y="216" font-family="Sora, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#f2f5ff">18 mo</text>
    <rect x="366" y="226" width="46" height="10" rx="5" fill="#ffc46b" fill-opacity="0.16"/>
    <text x="372" y="234" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#ffd28a">stable</text>

    <rect x="514" y="168" width="150" height="78" rx="12" fill="#111527" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="530" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7c88a8" letter-spacing="1">PENDING</text>
    <text x="530" y="216" font-family="Sora, Segoe UI, sans-serif" font-size="19" font-weight="600" fill="#f2f5ff">14</text>
    <rect x="530" y="226" width="58" height="10" rx="5" fill="#8f6bff" fill-opacity="0.18"/>
    <text x="536" y="234" font-family="Inter, Segoe UI, sans-serif" font-size="7.5" fill="#c3b0ff">2 need review</text>
  </g>

  <!-- chart -->
  <rect x="186" y="264" width="478" height="176" rx="12" fill="#111527" stroke="#ffffff" stroke-opacity="0.07"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M206 300h438M206 340h438M206 380h438M206 414h438"/>
  </g>
  <path d="M206 404c34-6 50-30 74-28s34 20 58 12 36-44 62-44 34 26 58 22 34-30 56-32 30 16 46 10v66H206z" fill="url(#n-area)"/>
  <path d="M206 404c34-6 50-30 74-28s34 20 58 12 36-44 62-44 34 26 58 22 34-30 56-32 30 16 46 10" fill="none" stroke="url(#n-line)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="552" cy="324" r="4" fill="#59e1ff"/>
  <circle cx="552" cy="324" r="9" fill="#59e1ff" fill-opacity="0.16"/>
  <text x="206" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#7c88a8" letter-spacing="1">NET FLOW · 30 DAYS</text>

  <!-- table -->
  <g>
    <rect x="186" y="456" width="478" height="24" rx="6" fill="#ffffff" fill-opacity="0.03"/>
    <g fill="#ffffff" fill-opacity="0.10">
      <rect x="200" y="465" width="90" height="6" rx="3"/>
      <rect x="330" y="465" width="60" height="6" rx="3"/>
      <rect x="440" y="465" width="50" height="6" rx="3"/>
      <rect x="560" y="465" width="46" height="6" rx="3"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="200" y="492" width="112" height="7" rx="3.5"/><rect x="330" y="492" width="70" height="7" rx="3.5"/><rect x="440" y="492" width="42" height="7" rx="3.5"/><rect x="560" y="492" width="36" height="7" rx="3.5"/>
      <rect x="200" y="516" width="86" height="7" rx="3.5"/><rect x="330" y="516" width="58" height="7" rx="3.5"/><rect x="440" y="516" width="46" height="7" rx="3.5"/><rect x="560" y="516" width="30" height="7" rx="3.5"/>
    </g>
  </g>
  <rect x="44" y="46" width="712" height="508" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
