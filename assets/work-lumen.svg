<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="LUMEN identity design board">
  <defs>
    <radialGradient id="l-bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#2a1e14"/>
      <stop offset="0.5" stop-color="#17110c"/>
      <stop offset="1" stop-color="#0b0806"/>
    </radialGradient>
    <linearGradient id="l-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#e4d7c4"/>
    </linearGradient>
    <linearGradient id="l-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf8f"/>
      <stop offset="0.5" stop-color="#ff9d5c"/>
      <stop offset="1" stop-color="#d96a3a"/>
    </linearGradient>
    <filter id="l-blur"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="l-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#l-bg)"/>
  <ellipse cx="150" cy="90" rx="220" ry="160" fill="#ff9d5c" opacity="0.28" filter="url(#l-blur)"/>

  <!-- light beam -->
  <path d="M98 0l150 600H62L20 0z" fill="url(#l-beam)" opacity="0.45"/>
  <path d="M212 0l64 600h-40L150 0z" fill="#ffd9a0" opacity="0.10"/>

  <!-- wordmark -->
  <text x="46" y="170" font-family="Instrument Serif, Georgia, serif" font-size="96" letter-spacing="10" fill="#f8f0e4">LUMEN</text>
  <text x="54" y="204" font-family="Inter, Segoe UI, sans-serif" font-size="11" letter-spacing="6" fill="#c9a77f">LIGHT · SPACE · FORM</text>
  <path d="M46 228h280" stroke="#ffb46b" stroke-opacity="0.5"/>

  <!-- cards -->
  <g transform="rotate(-8 470 300)">
    <rect x="330" y="250" width="290" height="170" rx="8" fill="url(#l-card)"/>
    <rect x="330" y="250" width="290" height="170" rx="8" fill="none" stroke="#000" stroke-opacity="0.06"/>
    <text x="360" y="316" font-family="Instrument Serif, Georgia, serif" font-size="42" fill="#241a12">L</text>
    <rect x="360" y="336" width="60" height="1.5" fill="#241a12" opacity="0.5"/>
    <text x="360" y="360" font-family="Inter, Segoe UI, sans-serif" font-size="8" letter-spacing="2.4" fill="#4a3a2c">LUMEN STUDIO</text>
    <text x="360" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="7" letter-spacing="1.4" fill="#7b6653">architectural lighting</text>
    <text x="566" y="396" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="7" fill="#7b6653">lumen.studio</text>
  </g>

  <g transform="rotate(6 540 420)">
    <rect x="420" y="360" width="250" height="150" rx="8" fill="#15100c"/>
    <rect x="420" y="360" width="250" height="150" rx="8" fill="none" stroke="#ffb46b" stroke-opacity="0.35"/>
    <text x="446" y="420" font-family="Instrument Serif, Georgia, serif" font-size="30" fill="#ffcf8f">Lumen</text>
    <rect x="446" y="440" width="70" height="1" fill="#ffb46b" opacity="0.6"/>
    <rect x="446" y="458" width="140" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="446" y="470" width="96" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="632" cy="460" r="14" fill="none" stroke="#ffb46b" stroke-opacity="0.7"/>
    <circle cx="632" cy="460" r="4" fill="#ffb46b"/>
  </g>

  <!-- palette -->
  <g>
    <rect x="46" y="486" width="64" height="64" rx="6" fill="#f6efe4"/>
    <rect x="118" y="486" width="64" height="64" rx="6" fill="#ffcf8f"/>
    <rect x="190" y="486" width="64" height="64" rx="6" fill="#ff9d5c"/>
    <rect x="262" y="486" width="64" height="64" rx="6" fill="#d96a3a"/>
    <rect x="334" y="486" width="64" height="64" rx="6" fill="#241a12"/>
    <text x="46" y="572" font-family="Inter, Segoe UI, sans-serif" font-size="8" letter-spacing="2.2" fill="#9c7f63">PALETTE 01 — WARM NEUTRALS</text>
  </g>

  <rect width="800" height="600" filter="url(#l-grain)" opacity="0.55" style="mix-blend-mode:overlay"/>
</svg>
