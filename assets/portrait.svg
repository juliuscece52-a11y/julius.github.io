<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880" role="img" aria-label="Portrait placeholder with monogram frame">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102036"/>
      <stop offset="0.5" stop-color="#081324"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.72" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#c9a25e" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#c9a25e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#c9a25e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dcab"/>
      <stop offset="0.5" stop-color="#c9a25e"/>
      <stop offset="1" stop-color="#8a6631"/>
    </linearGradient>
    <linearGradient id="pfigure" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1b304a"/>
      <stop offset="1" stop-color="#091320"/>
    </linearGradient>
    <linearGradient id="prim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#e9cf92" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9cf92" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0v60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="720" height="880" fill="url(#pbg)"/>
  <rect width="720" height="880" fill="url(#pgrid)"/>
  <rect width="720" height="880" fill="url(#pglow)"/>

  <!-- concentric rings -->
  <circle cx="360" cy="368" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
  <circle cx="360" cy="368" r="268" fill="none" stroke="#c9a25e" stroke-opacity="0.16"/>
  <circle cx="360" cy="368" r="268" fill="none" stroke="#c9a25e" stroke-opacity="0.22" stroke-dasharray="2 10"/>

  <!-- figure -->
  <path d="M108 880c8-176 112-274 252-274s244 98 252 274z" fill="url(#pfigure)"/>
  <path d="M330 612h60v66c0 22-13 34-30 34s-30-12-30-34z" fill="#0c1a2b"/>
  <ellipse cx="360" cy="352" rx="110" ry="130" fill="url(#pfigure)"/>
  <path d="M260 300c-14 44-16 90-4 134" fill="none" stroke="url(#prim)" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M180 848c10-142 88-222 178-234" fill="none" stroke="url(#prim)" stroke-width="2.5" stroke-opacity="0.28" stroke-linecap="round"/>
  <path d="M540 848c-10-142-88-222-178-234" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-linecap="round"/>

  <!-- frame -->
  <rect x="26" y="26" width="668" height="828" rx="18" fill="none" stroke="#c9a25e" stroke-opacity="0.16"/>

  <!-- monogram seal -->
  <g transform="translate(600 88)">
    <circle r="26" fill="#050b14" fill-opacity="0.7" stroke="#c9a25e" stroke-opacity="0.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="url(#pgold)" letter-spacing="1">JW</text>
  </g>
</svg>
