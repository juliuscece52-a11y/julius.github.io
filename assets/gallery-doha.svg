<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Doha skyline at dusk">
  <defs>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071427"/>
      <stop offset="0.6" stop-color="#0a1d32"/>
      <stop offset="1" stop-color="#143a52"/>
    </linearGradient>
    <linearGradient id="dsea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2639"/>
      <stop offset="1" stop-color="#04080f"/>
    </linearGradient>
    <radialGradient id="dglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0d9a2" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#c9a25e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9a25e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2dcab"/>
      <stop offset="1" stop-color="#b98f4d"/>
    </linearGradient>
    <pattern id="dwin" width="19" height="23" patternUnits="userSpaceOnUse">
      <rect x="4" y="7" width="5" height="7" fill="#e9cf92" fill-opacity="0.7"/>
      <rect x="13" y="7" width="4" height="7" fill="#e9cf92" fill-opacity="0.25"/>
    </pattern>
    <linearGradient id="dfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#dsky)"/>
  <circle cx="612" cy="252" r="210" fill="url(#dglow)"/>

  <g fill="#ffffff">
    <circle cx="96" cy="70" r="1.6" fill-opacity="0.55"/>
    <circle cx="178" cy="44" r="1.1" fill-opacity="0.4"/>
    <circle cx="262" cy="92" r="1.3" fill-opacity="0.45"/>
    <circle cx="404" cy="58" r="1" fill-opacity="0.35"/>
    <circle cx="520" cy="86" r="1.4" fill-opacity="0.5"/>
    <circle cx="690" cy="60" r="1.1" fill-opacity="0.4"/>
    <circle cx="742" cy="132" r="1.5" fill-opacity="0.45"/>
  </g>

  <!-- crescent moon -->
  <path d="M672 96a34 34 0 1042 50 40 40 0 01-42-50z" fill="#f2dcab" fill-opacity="0.85"/>

  <!-- far skyline -->
  <g fill="#0f2a40">
    <rect x="18" y="316" width="46" height="124"/>
    <rect x="70" y="342" width="34" height="98"/>
    <rect x="110" y="292" width="54" height="148"/>
    <rect x="248" y="330" width="42" height="110"/>
    <rect x="300" y="308" width="36" height="132"/>
    <rect x="520" y="322" width="48" height="118"/>
    <rect x="574" y="296" width="34" height="144"/>
    <rect x="700" y="336" width="44" height="104"/>
    <rect x="752" y="304" width="30" height="136"/>
  </g>

  <!-- foreground towers -->
  <g>
    <!-- stepped tower -->
    <path d="M168 440V268h58v172z" fill="#061121"/>
    <path d="M168 268h58v172h-58z" fill="url(#dwin)" opacity="0.75"/>
    <rect x="192" y="238" width="10" height="30" fill="#061121"/>
    <!-- Doha Tower (hyperboloid) -->
    <path d="M268 440V282c0-30 16-52 38-62v220z" fill="#081627"/>
    <path d="M344 440V220c22 10 38 32 38 62v158z" fill="#081627"/>
    <path d="M268 440V282c0-30 16-52 38-62v220zM344 440V220c22 10 38 32 38 62v158z" fill="url(#dwin)" opacity="0.5"/>
    <g stroke="#e9cf92" stroke-opacity="0.22" stroke-width="1.2">
      <path d="M272 400h62M277 350h52M285 300h36M296 256h14"/>
    </g>
    <!-- torch tower -->
    <path d="M414 440V214l14-24 14 24v226z" fill="#0a1b2d"/>
    <path d="M414 440V214l14-24 14 24v226z" fill="url(#dwin)" opacity="0.6"/>
    <path d="M428 152l16 30h-32z" fill="url(#dgold)" fill-opacity="0.8"/>
    <!-- wide block tower -->
    <rect x="474" y="286" width="76" height="154" fill="#071426"/>
    <rect x="474" y="286" width="76" height="154" fill="url(#dwin)" opacity="0.62"/>
    <rect x="486" y="262" width="52" height="24" fill="#071426"/>
    <!-- dome and low museum block -->
    <rect x="576" y="360" width="112" height="80" fill="#081627"/>
    <path d="M576 360a56 44 0 01112 0z" fill="#0b1c2e"/>
    <path d="M632 310v-16" stroke="#e9cf92" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="576" y="360" width="112" height="80" fill="url(#dwin)" opacity="0.3"/>
    <!-- slim twin towers -->
    <rect x="704" y="246" width="30" height="194" fill="#0a1b2d"/>
    <rect x="742" y="290" width="26" height="150" fill="#081627"/>
    <rect x="704" y="246" width="30" height="194" fill="url(#dwin)" opacity="0.55"/>
    <rect x="742" y="290" width="26" height="150" fill="url(#dwin)" opacity="0.4"/>
  </g>

  <!-- water -->
  <rect y="440" width="800" height="160" fill="url(#dsea)"/>
  <g fill="#e9cf92" fill-opacity="0.16">
    <rect x="188" y="452" width="18" height="3" rx="1.5"/>
    <rect x="290" y="466" width="24" height="3" rx="1.5"/>
    <rect x="352" y="454" width="14" height="3" rx="1.5"/>
    <rect x="498" y="470" width="30" height="3" rx="1.5"/>
    <rect x="612" y="458" width="20" height="3" rx="1.5"/>
    <rect x="714" y="474" width="26" height="3" rx="1.5"/>
    <rect x="120" y="486" width="40" height="2.5" rx="1.2" fill-opacity="0.1"/>
    <rect x="392" y="494" width="52" height="2.5" rx="1.2" fill-opacity="0.1"/>
    <rect x="640" y="500" width="60" height="2.5" rx="1.2" fill-opacity="0.1"/>
  </g>

  <!-- dhow -->
  <g>
    <path d="M96 512h124l-16 22H112z" fill="#050e18"/>
    <path d="M158 512V446l38 26-38 40z" fill="#0b1a2a"/>
    <path d="M150 512V456l-32 22 32 34z" fill="#091826"/>
    <path d="M100 512h116" stroke="#e9cf92" stroke-opacity="0.45" stroke-width="1.6"/>
    <rect x="94" y="536" width="132" height="3" rx="1.5" fill="#e9cf92" fill-opacity="0.12"/>
  </g>

  <rect width="800" height="600" fill="url(#dfade)" opacity="0.35"/>
  <rect x="0.5" y="0.5" width="799" height="599" fill="none" stroke="#c9a25e" stroke-opacity="0.12"/>
</svg>
