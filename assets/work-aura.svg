<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="AURA mobile app screens">
  <defs>
    <radialGradient id="a-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#2a1a3d"/>
      <stop offset="0.55" stop-color="#141021"/>
      <stop offset="1" stop-color="#08070d"/>
    </radialGradient>
    <linearGradient id="a-screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#221a33"/>
      <stop offset="1" stop-color="#0e0b18"/>
    </linearGradient>
    <radialGradient id="a-moon" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#e6ddff"/>
      <stop offset="0.6" stop-color="#b7a4ff"/>
      <stop offset="1" stop-color="#8f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <filter id="a-blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#a-bg)"/>
  <ellipse cx="380" cy="150" rx="230" ry="150" fill="#a86bff" opacity="0.30" filter="url(#a-blur)"/>
  <ellipse cx="640" cy="480" rx="180" ry="140" fill="#ff6fb0" opacity="0.16" filter="url(#a-blur)"/>

  <g opacity="0.55" stroke="#ffffff" stroke-opacity="0.06" fill="none">
    <circle cx="400" cy="300" r="240"/>
    <circle cx="400" cy="300" r="300"/>
  </g>

  <!-- back phone -->
  <g transform="translate(430 120) rotate(6 130 210)">
    <rect width="262" height="424" rx="34" fill="#0a0812" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="8" y="8" width="246" height="408" rx="28" fill="url(#a-screen)"/>
    <rect x="96" y="16" width="70" height="12" rx="6" fill="#0a0812"/>
    <rect x="26" y="48" width="90" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.20"/>
    <rect x="26" y="66" width="150" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="131" cy="182" r="66" fill="url(#a-moon)" opacity="0.9"/>
    <circle cx="131" cy="182" r="44" fill="#171224" opacity="0.55"/>
    <g fill="url(#a-wave)">
      <rect x="54" y="306" width="5" height="26" rx="2.5" opacity="0.55"/>
      <rect x="66" y="296" width="5" height="46" rx="2.5" opacity="0.7"/>
      <rect x="78" y="286" width="5" height="66" rx="2.5" opacity="0.85"/>
      <rect x="90" y="300" width="5" height="38" rx="2.5" opacity="0.65"/>
      <rect x="102" y="290" width="5" height="58" rx="2.5" opacity="0.8"/>
      <rect x="114" y="308" width="5" height="22" rx="2.5" opacity="0.5"/>
      <rect x="126" y="292" width="5" height="54" rx="2.5" opacity="0.75"/>
      <rect x="138" y="302" width="5" height="34" rx="2.5" opacity="0.6"/>
      <rect x="150" y="284" width="5" height="70" rx="2.5" opacity="0.9"/>
      <rect x="162" y="300" width="5" height="38" rx="2.5" opacity="0.65"/>
      <rect x="174" y="310" width="5" height="18" rx="2.5" opacity="0.45"/>
    </g>
    <rect x="54" y="360" width="150" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="54" y="360" width="86" height="8" rx="4" fill="url(#a-wave)"/>
    <circle cx="131" cy="398" r="16" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.2"/>
  </g>

  <!-- front phone -->
  <g transform="translate(196 96) rotate(-4 130 210)">
    <rect width="262" height="424" rx="34" fill="#0a0812" stroke="#ffffff" stroke-opacity="0.20"/>
    <rect x="8" y="8" width="246" height="408" rx="28" fill="url(#a-screen)"/>
    <rect x="96" y="16" width="70" height="12" rx="6" fill="#0a0812"/>
    <text x="26" y="62" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#a99cc4" letter-spacing="1.5">GOOD EVENING</text>
    <text x="26" y="86" font-family="Sora, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#f3ecff">Time to unwind</text>
    <circle cx="131" cy="188" r="74" fill="url(#a-moon)" opacity="0.85"/>
    <path d="M104 158a44 44 0 1060 64 52 52 0 01-60-64z" fill="#141020" opacity="0.75"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <circle cx="72" cy="120" r="1.6"/><circle cx="196" cy="104" r="1.2"/><circle cx="168" cy="150" r="1"/>
    </g>
    <!-- play card -->
    <rect x="24" y="286" width="214" height="76" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="56" cy="324" r="17" fill="url(#a-wave)"/>
    <path d="M52 317l11 7-11 7z" fill="#1a1024"/>
    <rect x="82" y="310" width="102" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="82" y="326" width="70" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.11"/>
    <rect x="82" y="340" width="122" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="82" y="340" width="48" height="5" rx="2.5" fill="#ff8fc7"/>
    <!-- nav dots -->
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="30" y="392" width="36" height="7" rx="3.5"/>
      <rect x="82" y="392" width="36" height="7" rx="3.5"/>
      <rect x="134" y="392" width="36" height="7" rx="3.5"/>
      <rect x="186" y="392" width="26" height="7" rx="3.5"/>
    </g>
  </g>
</svg>
