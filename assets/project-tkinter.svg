<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Tkinter game window preview">
  <defs>
    <linearGradient id="tkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#050a13"/>
    </linearGradient>
    <linearGradient id="tkgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dcab"/>
      <stop offset="1" stop-color="#b48a48"/>
    </linearGradient>
    <pattern id="tkgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0v26" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#tkbg)"/>

  <rect x="140" y="70" width="520" height="340" rx="14" fill="#060e1a" stroke="#ffffff" stroke-opacity="0.1"/>
  <rect x="140" y="70" width="520" height="44" rx="14" fill="#0d1c2e"/>
  <rect x="140" y="100" width="520" height="14" fill="#0d1c2e"/>
  <text x="168" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d6e0ee">Snake &middot; Tkinter</text>
  <circle cx="622" cy="92" r="4" fill="#c9a25e" fill-opacity="0.8"/>
  <circle cx="636" cy="92" r="4" fill="#ffffff" fill-opacity="0.16"/>

  <rect x="164" y="134" width="472" height="216" rx="6" fill="#071322"/>
  <rect x="164" y="134" width="472" height="216" rx="6" fill="url(#tkgrid)"/>
  <rect x="164" y="134" width="472" height="216" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g fill="url(#tkgold)">
    <rect x="216" y="262" width="24" height="24" rx="5"/>
    <rect x="242" y="262" width="24" height="24" rx="5"/>
    <rect x="268" y="262" width="24" height="24" rx="5"/>
    <rect x="294" y="262" width="24" height="24" rx="5"/>
    <rect x="294" y="236" width="24" height="24" rx="5"/>
    <rect x="294" y="210" width="24" height="24" rx="5"/>
    <rect x="320" y="210" width="24" height="24" rx="5"/>
  </g>
  <circle cx="398" cy="222" r="9" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="398" cy="222" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8fa3bb">
    <text x="188" y="158">SCORE 07</text>
    <text x="612" y="158" text-anchor="end">LEVEL 02</text>
  </g>

  <rect x="164" y="366" width="150" height="54" rx="8" fill="#0b1a2b" stroke="#c9a25e" stroke-opacity="0.28"/>
  <text x="184" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#c9a25e">NEW GAME</text>
  <rect x="184" y="400" width="72" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.14"/>

  <rect x="330" y="366" width="150" height="54" rx="8" fill="#0b1a2b" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="350" y="390" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2" fill="#8fa3bb">PAUSE</text>
  <rect x="350" y="400" width="52" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.1"/>

  <rect x="140" y="434" width="96" height="3" rx="1.5" fill="url(#tkgold)"/>
  <text x="140" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4" fill="#8b9bad">TKINTER GAMES</text>
  <text x="660" y="466" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#5f7186">PORTFOLIO</text>
</svg>
